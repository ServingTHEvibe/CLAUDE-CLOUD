<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Orders · Taylor Made Goodies</title>
<link rel="icon" href="/favicon.png">
<style>
@font-face { font-family: "Anton"; src: url("/fonts/anton-400.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "Manrope"; font-weight: 400 700; src: url("/fonts/manrope-variable.woff2") format("woff2"); font-display: swap; }
:root { --ink:#0c0907; --card:#1a130e; --line:rgba(244,235,221,.14); --cream:#f4ebdd; --muted:rgba(244,235,221,.66); --gold:#d9a441; --gold-hi:#f0c469; --pink:#ff3d8b; --green:#5fbf7a; }
* { box-sizing: border-box; }
body { margin:0; background:var(--ink); color:var(--cream); font:400 16px/1.5 "Manrope", system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
.wrap { max-width:760px; margin:0 auto; padding:20px 16px 80px; }
h1 { font:400 34px/1 "Anton", Impact, sans-serif; letter-spacing:.03em; margin:8px 0 4px; text-transform:uppercase; }
h1 em { font-style:normal; color:var(--gold); }
.sub { color:var(--muted); margin:0 0 20px; }
button, input { font:inherit; }
.btn { min-height:52px; padding:0 22px; border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--cream); font-weight:700; cursor:pointer; }
.btn--gold { background:linear-gradient(180deg,var(--gold-hi),var(--gold)); color:var(--ink); border:0; }
.login { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:24px; margin-top:24px; }
.login label { display:block; font-weight:700; margin-bottom:8px; }
.login input { width:100%; min-height:56px; border-radius:12px; border:1px solid var(--line); background:var(--ink); color:var(--cream); padding:0 16px; font-size:18px; margin-bottom:14px; }
.login .btn { width:100%; }
.err { color:var(--pink); min-height:1.5em; margin:10px 0 0; }
.bar { display:flex; gap:8px; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; }
.tabs { display:flex; gap:6px; flex-wrap:wrap; }
.tab { min-height:44px; padding:0 16px; border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--muted); font-weight:700; cursor:pointer; }
.tab[aria-pressed="true"] { background:var(--cream); color:var(--ink); border-color:var(--cream); }
.tab b { margin-left:6px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px; margin-bottom:14px; }
.card.is-new { border-color:rgba(217,164,65,.6); }
.top { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
.who { font-size:20px; font-weight:700; margin:0; }
.what { color:var(--gold); font-weight:700; margin:2px 0 0; }
.pill { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; padding:6px 10px; border-radius:999px; white-space:nowrap; }
.pill.new { background:var(--gold); color:var(--ink); }
.pill.contacted { background:#3a2a55; color:#d8c8ff; }
.pill.done { background:#1f3a27; color:var(--green); }
dl { display:grid; grid-template-columns:auto 1fr; gap:4px 14px; margin:14px 0; }
dt { color:var(--muted); font-size:14px; }
dd { margin:0; white-space:pre-wrap; word-break:break-word; }
.when { color:var(--muted); font-size:13px; margin:4px 0 0; }
.actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
.actions a, .actions button { flex:1 1 120px; min-height:50px; display:inline-flex; align-items:center; justify-content:center; border-radius:12px; border:1px solid var(--line); background:transparent; color:var(--cream); font-weight:700; text-decoration:none; cursor:pointer; }
.actions .go { background:var(--cream); color:var(--ink); border-color:var(--cream); }
.photos { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
.photos img { width:96px; height:96px; object-fit:cover; border-radius:10px; }
.empty { text-align:center; color:var(--muted); padding:48px 16px; border:1px dashed var(--line); border-radius:18px; }
[hidden] { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Taylor Made <em>Orders</em></h1>
  <p class="sub">Every order and question from the website lands here.</p>

  <form class="login" id="login" hidden>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn btn--gold" type="submit">Log in</button>
    <p class="err" id="loginErr" role="alert"></p>
  </form>

  <section id="app" hidden>
    <div class="bar">
      <div class="tabs" role="group" aria-label="Filter">
        <button class="tab" data-f="new" aria-pressed="true">New<b id="nNew"></b></button>
        <button class="tab" data-f="contacted" aria-pressed="false">Contacted<b id="nContacted"></b></button>
        <button class="tab" data-f="done" aria-pressed="false">Done<b id="nDone"></b></button>
        <button class="tab" data-f="all" aria-pressed="false">All</button>
      </div>
      <div class="tabs">
        <button class="tab" id="refresh">Refresh</button>
        <button class="tab" id="logout">Log out</button>
      </div>
    </div>
    <p class="err" id="appErr" role="alert"></p>
    <div id="list"></div>
  </section>
</div>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const KEY = 'tmg-admin-token';
  let token = ''; try { token = localStorage.getItem(KEY) || ''; } catch (e) {}
  let orders = []; let filter = 'new';
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const NEXT = { new: ['contacted', 'Mark contacted'], contacted: ['done', 'Mark done'], done: ['new', 'Move back to new'] };
  const LABELS = [['eventType','Occasion'],['products','Details'],['quantity','How many'],['eventDate','Needed by'],['fulfillment','Pickup / delivery'],['theme','Theme'],['colors','Colors'],['notes','Notes'],['phone','Phone'],['email','Email']];

  async function api(method, body, qs = '') {
    const res = await fetch('/api/admin' + qs, { method, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }, body: body ? JSON.stringify(body) : undefined });
    const data = await res.json().catch(() => ({}));
    if (res.status === 401 && method !== 'POST') { logout(); throw new Error(data.error || 'Please log in again.'); }
    if (!res.ok) throw new Error(data.error || 'Something went wrong.');
    return data;
  }
  function logout() { token = ''; try { localStorage.removeItem(KEY); } catch (e) {} $('#app').hidden = true; $('#login').hidden = false; $('#pw').focus(); }
  function fmtDate(iso) { const d = new Date(iso); return d.toLocaleString(undefined, { weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit' }); }
  function niceDate(s) { const d = new Date(s + 'T12:00:00'); return isNaN(d) ? s : d.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' }); }

  function render() {
    const count = (s) => orders.filter((o) => o.status === s).length;
    $('#nNew').textContent = count('new') || ''; $('#nContacted').textContent = count('contacted') || ''; $('#nDone').textContent = count('done') || '';
    const rows = orders.filter((o) => filter === 'all' || o.status === filter);
    if (!rows.length) { $('#list').innerHTML = `<p class="empty">${filter === 'new' ? 'No new orders right now.' : 'Nothing here yet.'}</p>`; return; }
    $('#list').innerHTML = rows.map((o) => {
      const l = o.lead || {};
      const facts = LABELS.map(([k, label]) => {
        let v = Array.isArray(l[k]) ? l[k].join(', ') : l[k];
        if (!v) return '';
        if (k === 'eventDate') v = niceDate(v);
        return `<dt>${label}</dt><dd>${esc(v)}</dd>`;
      }).join('');
      const tel = l.phone ? l.phone.replace(/[^\d+]/g, '') : '';
      const [nx, nxLabel] = NEXT[o.status] || NEXT.new;
      return `<article class="card ${o.status === 'new' ? 'is-new' : ''}">
        <div class="top"><div><p class="who">${esc(l.name || 'No name')}</p><p class="what">${esc(l.orderType || 'Inquiry')}</p><p class="when">${fmtDate(o.receivedAt)} · ${esc(o.id)}</p></div><span class="pill ${o.status}">${o.status}</span></div>
        <dl>${facts}</dl>
        ${l.referenceImageCount ? `<button class="tab" data-photos="${esc(o.id)}">See ${l.referenceImageCount} photo${l.referenceImageCount > 1 ? 's' : ''}</button><div class="photos" id="ph-${esc(o.id)}"></div>` : ''}
        <div class="actions">
          ${tel ? `<a href="tel:${esc(tel)}">Call</a><a href="sms:${esc(tel)}">Text</a>` : ''}
          ${l.email ? `<a href="mailto:${esc(l.email)}?subject=${encodeURIComponent('Your Taylor Made Goodies order ' + o.id)}">Email</a>` : ''}
          <button class="go" data-id="${esc(o.id)}" data-status="${nx}">${nxLabel}</button>
        </div>
      </article>`;
    }).join('');
  }

  async function load() {
    $('#appErr').textContent = '';
    try { orders = (await api('GET')).orders || []; $('#login').hidden = true; $('#app').hidden = false; render(); }
    catch (e) { $('#appErr').textContent = e.message; }
  }

  $('#login').addEventListener('submit', async (e) => {
    e.preventDefault(); $('#loginErr').textContent = '';
    try { token = (await api('POST', { password: $('#pw').value })).token; try { localStorage.setItem(KEY, token); } catch (err) {} $('#pw').value = ''; load(); }
    catch (err) { $('#loginErr').textContent = err.message; }
  });
  document.querySelectorAll('[data-f]').forEach((b) => b.addEventListener('click', () => {
    filter = b.dataset.f; document.querySelectorAll('[data-f]').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); render();
  }));
  $('#refresh').addEventListener('click', load);
  $('#logout').addEventListener('click', logout);
  $('#list').addEventListener('click', async (e) => {
    const s = e.target.closest('[data-status]');
    if (s) {
      s.disabled = true;
      try { const { order } = await api('PATCH', { id: s.dataset.id, status: s.dataset.status }); orders = orders.map((o) => o.id === order.id ? order : o); render(); }
      catch (err) { $('#appErr').textContent = err.message; s.disabled = false; }
      return;
    }
    const p = e.target.closest('[data-photos]');
    if (p) {
      p.disabled = true;
      try { const { photos } = await api('GET', null, '?photos=' + encodeURIComponent(p.dataset.photos)); document.getElementById('ph-' + p.dataset.photos).innerHTML = photos.length ? photos.map((src) => `<a href="${src}" target="_blank"><img src="${src}" alt="Reference photo"></a>`).join('') : 'Photos were too large to save. Check your email.'; p.hidden = true; }
      catch (err) { $('#appErr').textContent = err.message; p.disabled = false; }
    }
  });
  if (token) load(); else logout();
  setInterval(() => { if (token && !document.hidden) load(); }, 60000);
})();
</script>
</body>
</html>
